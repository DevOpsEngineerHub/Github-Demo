name: Day 05 - Conditional Execution Demo

on:
  workflow_dispatch: 

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run only on main branch
        if: github.ref == 'refs/heads/main'
        run: echo "✅ This is the main branch"

      - name: Run only on Linux runner
        if: runner.os == 'Linux'
        run: echo "✅ Running on Linux"

      - name: Run only if previous steps succeeded
        if: success()
        run: echo "✅ All previous steps passed"

      - name: Force a failure (for demo)
        run: exit 1

      - name: Run only if something failed
        if: failure()
        run: echo "❌ A previous step failed"

      - name: Always run this, pass or fail
        if: always()
        run: echo "🔁 This always runs"
